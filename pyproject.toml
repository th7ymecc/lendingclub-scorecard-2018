[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lendingclub-scorecard"
version = "1.0.0"
description = "LendingClub 信用评分卡：OOT、PSI、Vintage、阈值扫描与上线后监控"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "lightgbm>=4.5,<5",
]

[project.scripts]
lendingclub-scorecard = "lendingclub_scorecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
